name: CI

# Runs only when started by hand (Actions, CI, Run workflow), to stay inside the free Actions minutes of private
# repositories. Before every push, run `cargo fmt --check`, `cargo clippy --all-targets -- -D warnings` and
# `cargo test` locally; those are the gate.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the compiler, clippy, rustfmt and the WebAssembly target.
      - run: rustup show active-toolchain || rustup toolchain install
      # ALSA's headers, for the sound device in `rts-platform` (cpal) on Linux.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test
